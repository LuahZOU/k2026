<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>甲子園2026 データベース</title>
<style>
/* ------------------------------------------------------------------
   配色は球場から取る。芝の緑をアクセント、内野の土を状態色に、
   地色は緑寄りに振ったオフホワイト（純グレーだと既製品に見える）。
   数字は手動スコアボードの見え方に寄せて等幅＋タブular。
   日本語Webフォントはデータ URI にすると数MBになりCSPの制約下で現実的でないため、
   本文はシステムフォント、数字だけ等幅フェイスという2役構成にしている。
------------------------------------------------------------------ */
:root{
  --ground:#f1f4f1; --panel:#fff; --ink:#151918; --ink-2:#5b6661;
  --line:#dce2dd; --line-2:#eef1ee;
  --turf:#0f6b3f; --turf-soft:#e3efe8;
  --clay:#a95336; --clay-soft:#f7e8e2;
  --board:#1b2320; --board-ink:#f0f3ef;
  --shadow:0 1px 2px rgba(18,32,26,.05), 0 10px 28px rgba(18,32,26,.07);
  --font-ui:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0f1312; --panel:#171d1b; --ink:#e7ece8; --ink-2:#93a099;
    --line:#27302c; --line-2:#1e2523;
    --turf:#52c288; --turf-soft:#153026;
    --clay:#d9836a; --clay-soft:#33201a;
    --board:#0a0e0d; --board-ink:#e7ece8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0f1312; --panel:#171d1b; --ink:#e7ece8; --ink-2:#93a099;
  --line:#27302c; --line-2:#1e2523;
  --turf:#52c288; --turf-soft:#153026;
  --clay:#d9836a; --clay-soft:#33201a;
  --board:#0a0e0d; --board-ink:#e7ece8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --ground:#f1f4f1; --panel:#fff; --ink:#151918; --ink-2:#5b6661;
  --line:#dce2dd; --line-2:#eef1ee;
  --turf:#0f6b3f; --turf-soft:#e3efe8;
  --clay:#a95336; --clay-soft:#f7e8e2;
  --board:#1b2320; --board-ink:#f0f3ef;
  --shadow:0 1px 2px rgba(18,32,26,.05), 0 10px 28px rgba(18,32,26,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:15px/1.7 var(--font-ui); -webkit-font-smoothing:antialiased;
  overflow-wrap:anywhere;
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--turf); outline-offset:2px; border-radius:4px}

/* ---------- ヘッダ ---------- */
.top{position:sticky; top:0; z-index:30; background:var(--panel); border-bottom:1px solid var(--line)}
.top__in{padding:12px 16px 0; max-width:1180px; margin:0 auto}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{margin:0; font-size:17px; font-weight:800; letter-spacing:.04em}
.brand .no{
  font:700 11px/1 var(--font-num); letter-spacing:.08em; color:var(--turf);
  background:var(--turf-soft); padding:4px 7px; border-radius:4px;
}
.brand .meta{font-size:11.5px; color:var(--ink-2); flex-basis:100%; margin-top:2px}
.tabs{display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  appearance:none; border:0; background:none; color:var(--ink-2); cursor:pointer;
  font:inherit; font-size:14px; padding:9px 13px; white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tabs button[aria-selected="true"]{color:var(--turf); border-bottom-color:var(--turf); font-weight:800}

/* ---------- 共通 ---------- */
main{max-width:1180px; margin:0 auto; padding:16px 16px 60px}
.controls{display:flex; flex-direction:column; gap:9px; margin-bottom:14px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
input[type=search],select{
  font:inherit; font-size:15px; padding:9px 11px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); color:var(--ink); min-width:0;
}
input[type=search]{flex:1 1 100%}
select{flex:1 1 auto}
.chip{
  font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--turf-soft); border-color:var(--turf); color:var(--turf); font-weight:700}
.count{font:600 12.5px/1 var(--font-num); color:var(--ink-2); letter-spacing:.03em}
.tag{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:4px; background:var(--line-2); color:var(--ink-2); letter-spacing:.02em}
.tag--new{background:var(--clay-soft); color:var(--clay)}
.tag--both{background:var(--turf-soft); color:var(--turf)}
.empty{padding:44px 16px; text-align:center; color:var(--ink-2)}
.note{font-size:12px; color:var(--ink-2); margin:10px 2px 0}

/* ---------- 学校カード（スマホ既定） ---------- */
.cards{display:grid; gap:10px}
.scard{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
  font:inherit; color:inherit; width:100%; display:block;
}
.scard:hover{border-color:var(--turf)}
.scard__top{display:flex; align-items:center; gap:7px; margin-bottom:3px}
.scard__pref{font:600 11.5px/1 var(--font-num); color:var(--ink-2); letter-spacing:.05em}
.scard__name{font-size:18px; font-weight:800; letter-spacing:.01em; margin:0}
.scard__sub{font-size:12.5px; color:var(--ink-2); margin:1px 0 9px}
.board{
  display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:7px; overflow:hidden;
}
.board div{background:var(--panel); padding:5px 2px; text-align:center}
.board b{display:block; font:700 15px/1.2 var(--font-num); font-variant-numeric:tabular-nums}
.board span{display:block; font-size:9.5px; color:var(--ink-2); letter-spacing:.04em; margin-top:2px}
.scard__next{
  margin:9px 0 0; padding-top:8px; border-top:1px dashed var(--line);
  font-size:12.5px; color:var(--ink-2);
}
.scard__next b{color:var(--ink); font-weight:700}

/* ---------- 学校テーブル（PC） ---------- */
.tablewrap{display:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line-2); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
thead th{
  position:sticky; top:0; background:var(--panel); z-index:1; cursor:pointer;
  font-size:11px; color:var(--ink-2); font-weight:800; letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
td.n,th.n{text-align:right; font-family:var(--font-num); font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--turf-soft)}

/* ---------- 選手リスト ---------- */
.plist{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.prow{display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; padding:10px 13px; border-bottom:1px solid var(--line-2); cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--turf-soft)}
.prow__no{
  font:700 13px/1 var(--font-num); color:var(--board-ink); background:var(--board);
  border-radius:5px; padding:6px 0; text-align:center; font-variant-numeric:tabular-nums;
}
.prow__name{font-size:15px; font-weight:700}
.prow__sub{font-size:11.5px; color:var(--ink-2); margin-top:1px}
.prow__hand{font:600 12px/1 var(--font-num); color:var(--ink-2); white-space:nowrap}

/* ---------- 日程 ---------- */
.day{margin-bottom:16px}
.dayhead{display:flex; align-items:baseline; gap:9px; margin:0 2px 7px}
.dayhead .d{font-size:15px; font-weight:800}
.dayhead .n{font:600 11px/1 var(--font-num); color:var(--ink-2); letter-spacing:.05em}
.games{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.game{padding:11px 14px; border-bottom:1px solid var(--line-2)}
.game:last-child{border-bottom:0}
.game__hd{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px}
.game__rd{font:600 11px/1 var(--font-num); color:var(--ink-2); letter-spacing:.05em}
.game__tm{font:600 12px/1 var(--font-num); color:var(--ink-2); font-variant-numeric:tabular-nums}
.side{display:flex; align-items:center; gap:8px; padding:3px 0}
.side__name{font-size:15px; font-weight:700; background:none; border:0; padding:0; font-family:inherit; color:inherit; cursor:pointer; text-align:left}
.side__name:hover{color:var(--turf); text-decoration:underline}
.side__pref{font-size:11px; color:var(--ink-2)}
.side__score{margin-left:auto; font:700 17px/1 var(--font-num); font-variant-numeric:tabular-nums}
.side--tbd .side__name{color:var(--ink-2); font-weight:400; font-style:italic; cursor:default}
.side--tbd .side__name:hover{text-decoration:none; color:var(--ink-2)}

/* ---------- 詳細シート ---------- */
.veil{position:fixed; inset:0; background:rgba(10,18,14,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s}
.veil.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; inset:auto 0 0 0; height:92dvh; background:var(--panel); z-index:50;
  border-radius:16px 16px 0 0; box-shadow:var(--shadow); transform:translateY(100%);
  transition:transform .22s ease; display:flex; flex-direction:column;
}
.sheet.on{transform:none}
.sheet__bar{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex:0 0 auto}
.sheet__bar h2{margin:0; font-size:18px; font-weight:800; flex:1}
.sheet__close{border:0; background:var(--line-2); color:var(--ink); width:32px; height:32px; border-radius:50%; font-size:19px; line-height:1; cursor:pointer}
.sheet__body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 40px}
.dsub{font-size:12.5px; color:var(--ink-2); margin:0 0 12px}
.feature{background:var(--turf-soft); border-radius:10px; padding:12px 14px; margin:0 0 16px; font-size:14px; line-height:1.85}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; margin:0 0 18px}
.kv dt{color:var(--ink-2); white-space:nowrap}
.kv dd{margin:0}
.sec{font-size:11px; color:var(--ink-2); letter-spacing:.08em; font-weight:800; margin:20px 0 7px}
.roster{width:100%; border-collapse:collapse; font-size:13px}
.roster th,.roster td{padding:6px 8px; border-bottom:1px solid var(--line-2); white-space:nowrap}
.roster th{font-size:10.5px; color:var(--ink-2); letter-spacing:.05em; text-align:left}
.roster td:first-child{font-family:var(--font-num); font-variant-numeric:tabular-nums; text-align:right; width:34px}
.roster td.num{text-align:right; font-family:var(--font-num); font-variant-numeric:tabular-nums}
.roster th{white-space:nowrap}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px}

/* ---------- 広い画面 ---------- */
@media (min-width:860px){
  .top__in,main{padding-left:24px; padding-right:24px}
  input[type=search]{flex:0 1 300px}
  select{flex:0 0 auto}
  .cards{display:none}
  .tablewrap{display:block}
  .plist .prow{grid-template-columns:34px 200px 1fr auto}
  .veil{background:rgba(10,18,14,.38)}
  .sheet{
    inset:0 0 0 auto; height:100dvh; width:min(660px,100%);
    border-radius:0; transform:translateX(100%);
  }
  .sheet.on{transform:none}
}
/* ---------- お気に入り・メモ ---------- */
.star{
  border:0; background:none; cursor:pointer; padding:4px 6px; line-height:1;
  font-size:19px; color:var(--line); flex:0 0 auto; border-radius:6px;
}
.star:hover{color:var(--clay)}
.star[aria-pressed="true"]{color:var(--clay)}
.scard{position:relative}
.scard .star{position:absolute; top:8px; right:8px}
.prow{grid-template-columns:34px 1fr auto auto}
.memo{
  width:100%; font:inherit; font-size:14px; line-height:1.7; padding:9px 11px;
  border:1px solid var(--line); border-radius:9px; background:var(--ground);
  color:var(--ink); resize:vertical; min-height:64px;
}
.memo:focus{outline:2px solid var(--turf); outline-offset:-1px; background:var(--panel)}
.memo-hint{font-size:11px; color:var(--ink-2); margin:4px 2px 0}
.hasmemo{color:var(--turf); font-size:11px; font-weight:700}
.favcard{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; box-shadow:var(--shadow); margin-bottom:10px;
}
.favcard h4{margin:0 0 2px; font-size:16px; font-weight:800}
.favcard .who{font-size:12px; color:var(--ink-2); margin:0 0 8px}
.favcard .note{white-space:pre-wrap; font-size:13.5px; background:var(--ground);
  border-radius:8px; padding:9px 11px; margin:0}
.favhead{display:flex; align-items:center; gap:8px; margin:0 0 8px}
.favhead .star{font-size:17px}
.io{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  font:inherit; font-size:13.5px; padding:8px 14px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
}
.btn:hover{border-color:var(--turf); color:var(--turf)}
.btn--warn:hover{border-color:var(--clay); color:var(--clay)}
.foot{max-width:1180px; margin:0 auto; padding:0 16px 44px; font-size:11.5px; color:var(--ink-2); line-height:1.8}
</style>
<style>
#lock{position:fixed; inset:0; z-index:100; background:var(--ground); display:flex;
  align-items:center; justify-content:center; padding:24px}
#lock .box{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:26px 24px; width:100%; max-width:380px}
#lock h1{margin:0 0 4px; font-size:19px; font-weight:800; letter-spacing:.03em}
#lock p{margin:0 0 16px; font-size:13px; color:var(--ink-2); line-height:1.8}
#lock label{display:block; font-size:12px; color:var(--ink-2); margin:0 0 6px; font-weight:700}
#lock input{width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line);
  border-radius:9px; background:var(--ground); color:var(--ink)}
#lock input:focus{outline:2px solid var(--turf); outline-offset:-1px; background:var(--panel)}
#lock button{width:100%; margin-top:12px; font:inherit; font-size:15px; font-weight:700;
  padding:12px; border:0; border-radius:9px; background:var(--turf); color:#fff; cursor:pointer}
#lock button:disabled{opacity:.6; cursor:default}
#lock .err{color:var(--clay); font-size:13px; margin-top:10px; min-height:1.2em}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <h1>甲子園2026 データベース</h1>
    <p>第108回全国高校野球選手権大会<br>合い言葉を入れると開きます。</p>
    <label for="pw">合い言葉</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" inputmode="text">
    <button id="go" type="button">開く</button>
    <p class="err" id="err"></p>
  </div>
</div>
<div id="app" hidden>
<div class="top">
  <div class="top__in">
    <div class="brand">
      <h1>甲子園2026 データベース</h1>
      <span class="no">第108回</span>
      <span class="meta" id="meta"></span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="schools" aria-selected="true">学校</button>
      <button role="tab" data-tab="players" aria-selected="false">選手</button>
      <button role="tab" data-tab="rank" aria-selected="false">ランキング</button>
      <button role="tab" data-tab="matches" aria-selected="false">日程</button>
      <button role="tab" data-tab="favs" aria-selected="false">★ お気に入り<span id="fav-badge"></span></button>
    </div>
  </div>
</div>

<main>
  <section id="tab-schools">
    <div class="controls">
      <div class="row"><input type="search" id="s-q" placeholder="学校名・都道府県・OB・特徴で検索"></div>
      <div class="row">
        <select id="s-block"><option value="">全地区</option></select>
        <select id="s-sort">
          <option value="地区">地区順</option>
          <option value="夏の出場回数">夏の出場回数が多い順</option>
          <option value="春の出場回数">春の出場回数が多い順</option>
          <option value="県外中学出身">県外中学出身が多い順</option>
          <option value="左投げ">左投げが多い順</option>
          <option value="3年">3年生が多い順</option>
          <option value="初戦日">初戦が早い順</option>
        </select>
      </div>
      <div class="row">
        <button class="chip" data-sf="お気に入り" aria-pressed="false">★ お気に入り</button>
        <button class="chip" data-sf="公立" aria-pressed="false">公立</button>
        <button class="chip" data-sf="初出場" aria-pressed="false">初出場</button>
        <button class="chip" data-sf="春夏連続" aria-pressed="false">春夏連続</button>
        <span class="count" id="s-count"></span>
      </div>
    </div>
    <div class="cards" id="s-cards"></div>
    <div class="tablewrap"><table id="s-table"></table></div>
    <p class="note">学校を選ぶとチームの特徴と登録メンバー20名が開きます。</p>
  </section>

  <section id="tab-players" hidden>
    <div class="controls">
      <div class="row"><input type="search" id="p-q" placeholder="選手名・学校名・出身中学で検索"></div>
      <div class="row">
        <select id="p-grade"><option value="">全学年</option><option value="3">3年</option><option value="2">2年</option><option value="1">1年</option></select>
        <select id="p-throw"><option value="">投げ</option><option value="右">右投げ</option><option value="左">左投げ</option></select>
        <select id="p-bat"><option value="">打ち</option><option value="右">右打ち</option><option value="左">左打ち</option><option value="両">両打ち</option></select>
        <span class="count" id="p-count"></span>
      </div>
      <div class="row">
        <button class="chip" id="p-fav" aria-pressed="false">★ お気に入りのみ</button>
      </div>
    </div>
    <div class="plist" id="p-list"></div>
    <p class="note" id="p-more"></p>
  </section>

  <section id="tab-rank" hidden>
    <div class="controls">
      <div class="row">
        <select id="r-cat">
          <optgroup label="打撃">
            <option value="打率">打率</option>
            <option value="安打">安打</option>
            <option value="本塁打">本塁打</option>
            <option value="打点">打点</option>
            <option value="得点">得点</option>
            <option value="二塁打">二塁打</option>
            <option value="三塁打">三塁打</option>
            <option value="盗塁">盗塁</option>
            <option value="四死球">四死球</option>
            <option value="犠打">犠打</option>
          </optgroup>
          <optgroup label="投手">
            <option value="P奪三振">奪三振</option>
            <option value="P回数">投球回</option>
            <option value="P被安打">被安打（少ない順）</option>
            <option value="P失点">失点（少ない順）</option>
          </optgroup>
        </select>
        <select id="r-min">
          <option value="10">10打数以上</option>
          <option value="15">15打数以上</option>
          <option value="20">20打数以上</option>
          <option value="0">打数を問わない</option>
        </select>
        <select id="r-pmin">
          <option value="10">10回以上</option>
          <option value="15">15回以上</option>
          <option value="0">回数を問わない</option>
        </select>
        <select id="r-grade"><option value="">全学年</option><option value="3">3年</option><option value="2">2年</option><option value="1">1年</option></select>
        <span class="count" id="r-count"></span>
      </div>
    </div>
    <div class="scrollx"><table class="roster" id="r-table"></table></div>
    <p class="note" id="r-note"></p>
  </section>

  <section id="tab-matches" hidden>
    <div class="controls">
      <div class="row" id="m-rounds"></div>
      <div class="row"><span class="count" id="m-count"></span></div>
    </div>
    <div id="m-list"></div>
  </section>

  <section id="tab-favs" hidden>
    <div class="controls">
      <p class="note" style="margin:0 0 4px">
        ★とメモは<strong>お使いの端末のブラウザにだけ</strong>保存されます。
        このページを他の人と共有しても、あなたの登録内容が相手に見えることはありません。
        逆に、他の端末（スマホとPCなど）とも自動では共有されないので、
        持ち出したいときは下の書き出し／読み込みを使ってください。
      </p>
      <div class="io">
        <button class="btn" id="io-export">JSONに書き出す</button>
        <button class="btn" id="io-import">JSONを読み込む</button>
        <button class="btn btn--warn" id="io-clear">すべて消す</button>
        <span class="count" id="f-count"></span>
      </div>
      <p class="note" id="io-msg"></p>
    </div>
    <div id="f-list"></div>
  </section>
</main>

<p class="foot" id="foot"></p>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-label="学校の詳細">
  <div class="sheet__bar">
    <h2 id="sheet-title"></h2>
    <button class="sheet__close" id="sheet-close" aria-label="閉じる">&times;</button>
  </div>
  <div class="sheet__body" id="sheet-body"></div>
</aside>


</div>
<script>
window.__bootApp = function(DATA){


const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
const BLOCKS = ['北海道','東北','関東','東京','北信越','東海','近畿','中国','四国','九州'];
const NUMCOL = ['夏の出場回数','春の出場回数','3年','2年','1年','左投げ','県外中学出身','登録人数'];

/* ---------- お気に入り・メモの保存 ----------
   保存先はブラウザのlocalStorage。端末ごと・URLごとに別々に貯まるので、
   PCのHTMLとスマホのArtifactの間では自動同期しない。行き来させたいときは
   ★タブのJSON書き出し／読み込みを使う。
   file:// でlocalStorageが使えない環境でも落ちないよう、失敗時はメモリ保持に落とす。 */
const STORE = (() => {
  const KEY = 'koshien2026.v1';
  let mem = { favs: {}, notes: {} };
  let usable = true;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) mem = Object.assign(mem, JSON.parse(raw));
    localStorage.setItem(KEY, JSON.stringify(mem));
  } catch (e) { usable = false; }

  const save = () => {
    if (!usable) return;
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { usable = false; }
  };
  return {
    usable: () => usable,
    isFav:  id => !!mem.favs[id],
    toggle: id => { mem.favs[id] ? delete mem.favs[id] : mem.favs[id] = 1; save(); },
    note:   id => mem.notes[id] || '',
    setNote:(id,v) => { v.trim() ? mem.notes[id] = v : delete mem.notes[id]; save(); },
    all:    () => mem,
    count:  () => Object.keys(mem.favs).length + Object.keys(mem.notes).length,
    replace:obj => { mem = { favs: obj.favs||{}, notes: obj.notes||{} }; save(); },
    clear:  () => { mem = { favs:{}, notes:{} }; save(); }
  };
})();
const sid = school => 's:' + school;                 // 学校のID
const pid = p => 'p:' + p['学校名'] + '|' + p['選手名'];  // 選手のID

function starBtn(id, onChange){
  const b = el('button','star','★');
  b.type='button';
  b.setAttribute('aria-pressed', String(STORE.isFav(id)));
  b.title = 'お気に入り';
  b.addEventListener('click', ev => {
    ev.stopPropagation();
    STORE.toggle(id);
    b.setAttribute('aria-pressed', String(STORE.isFav(id)));
    syncFavUI();
    if (onChange) onChange();
  });
  return b;
}
function memoBox(id, label){
  const wrap = el('div');
  const ta = el('textarea','memo');
  ta.value = STORE.note(id);
  ta.placeholder = label + 'のメモ（自動保存）';
  let t = null;
  ta.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { STORE.setNote(id, ta.value); syncFavUI(); }, 400);
  });
  ta.addEventListener('blur', () => { STORE.setNote(id, ta.value); syncFavUI(); });
  wrap.append(ta);
  if (!STORE.usable()) {
    wrap.append(el('p','memo-hint','※このブラウザでは保存できません。★タブから書き出してください'));
  }
  return wrap;
}
function syncFavUI(){
  const n = STORE.count();
  $('#fav-badge').textContent = n ? ` ${n}` : '';
  if (!$('#tab-favs').hidden) drawFavs();
}

/* ---------- タブ ---------- */
const TABS = ['schools','players','rank','matches','favs'];
document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', String(x===b)));
    TABS.forEach(t=>{ $('#tab-'+t).hidden = (t!==b.dataset.tab); });
    if (b.dataset.tab === 'favs') drawFavs();
    window.scrollTo(0,0);
  });
});

/* ---------- 学校 ---------- */
const S = {q:'', block:'', sort:'地区', dir:1, flags:new Set()};

[...new Set(DATA.schools.map(s=>s['地区']))]
  .sort((a,b)=>BLOCKS.indexOf(a)-BLOCKS.indexOf(b))
  .forEach(b=>{ const o=el('option',null,b); o.value=b; $('#s-block').append(o); });

document.querySelectorAll('[data-sf]').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.sf;
    S.flags.has(k) ? S.flags.delete(k) : S.flags.add(k);
    b.setAttribute('aria-pressed', String(S.flags.has(k)));
    drawSchools();
  });
});
$('#s-q').addEventListener('input', e=>{ S.q=e.target.value.trim(); drawSchools(); });
$('#s-block').addEventListener('change', e=>{ S.block=e.target.value; drawSchools(); });
$('#s-sort').addEventListener('change', e=>{
  S.sort=e.target.value;
  S.dir = (S.sort==='地区'||S.sort==='初戦日') ? 1 : -1;   // 回数系は多い順が自然
  drawSchools();
});

function sHay(s){
  return [s['学校名'],s['都道府県'],s['地区'],s['公私'],s['主なプロ野球OB'],s['チームの特徴'],s['初戦の相手']].join(' ');
}
function sCmp(a,b,key,dir){
  if(NUMCOL.includes(key)){
    const x=a[key]===''?-1:+a[key], y=b[key]===''?-1:+b[key];
    return (x-y)*dir || String(a['学校名']).localeCompare(String(b['学校名']),'ja');
  }
  if(key==='地区'){
    const d=(BLOCKS.indexOf(a['地区'])-BLOCKS.indexOf(b['地区']))*dir;
    if(d) return d;
  }
  return String(a[key]).localeCompare(String(b[key]),'ja')*dir;
}
function sFiltered(){
  const rows=DATA.schools.filter(s=>{
    if(S.block && s['地区']!==S.block) return false;
    if(S.flags.has('お気に入り') && !STORE.isFav(sid(s['学校名']))) return false;
    if(S.flags.has('公立') && s['公私']!=='公立') return false;
    if(S.flags.has('初出場') && !s['初出場']) return false;
    if(S.flags.has('春夏連続') && !s['春夏連続']) return false;
    if(S.q && !sHay(s).includes(S.q)) return false;
    return true;
  });
  rows.sort((a,b)=>sCmp(a,b,S.sort,S.dir));
  return rows;
}
function md(iso){ return iso ? (+iso.slice(5,7))+'/'+(+iso.slice(8,10)) : ''; }

function schoolCard(s){
  const c=el('div','scard'); c.tabIndex=0; c.setAttribute('role','button');
  c.append(starBtn(sid(s['学校名']), drawSchools));
  const top=el('div','scard__top');
  top.append(el('span','scard__pref', s['都道府県']));
  if(s['初出場']) top.append(el('span','tag tag--new','初出場'));
  else if(s['春夏連続']) top.append(el('span','tag tag--both','春夏連続'));
  c.append(top);
  c.append(el('h3','scard__name', s['学校名']));
  c.append(el('p','scard__sub',
    `${s['夏の出場']}・${s['公私']}` + (s['監督'] ? `・${s['監督']}監督` : '')
    + (s['登録人数_球歴'] ? `・部員${s['登録人数_球歴']}名` : '')));
  const b=el('div','board');
  [['夏',s['夏の出場回数']],['春',s['春の出場回数']===''?'—':s['春の出場回数']],
   ['3年',s['3年']],['左腕',s['左投げ']],['県外',s['県外中学出身']]].forEach(([k,v])=>{
    const d=el('div'); d.append(el('b',null,String(v)), el('span',null,k)); b.append(d);
  });
  c.append(b);
  if(s['初戦日']){
    const n=el('p','scard__next');
    n.append(`初戦 ${md(s['初戦日'])} ${s['初戦の回戦']} ${s['初戦の開始時刻']} `);
    n.append(el('b',null,'vs '+s['初戦の相手']));
    c.append(n);
  }
  c.addEventListener('click',()=>openSchool(s['学校名']));
  c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSchool(s['学校名']); } });
  return c;
}
const S_COLS=[
  {k:'',h:'★',r:s=>starBtn(sid(s['学校名']), drawSchools)},
  {k:'地区',h:'地区'},{k:'都道府県',h:'都道府県'},
  {k:'学校名',h:'学校名',r:s=>{
    const w=el('span'); w.append(el('strong',null,s['学校名']));
    if(s['初出場']) w.append(' ', el('span','tag tag--new','初出場'));
    else if(s['春夏連続']) w.append(' ', el('span','tag tag--both','春夏連続'));
    return w;
  }},
  {k:'公私',h:'公私'},{k:'監督',h:'監督'},{k:'登録人数_球歴',h:'部員',n:1},{k:'夏の出場',h:'夏の出場'},
  {k:'夏の出場回数',h:'夏',n:1},
  {k:'春の出場回数',h:'春',n:1,r:s=>s['春の出場回数']===''?'—':s['春の出場回数']},
  {k:'3年',h:'3年',n:1},{k:'左投げ',h:'左腕',n:1},{k:'県外中学出身',h:'県外',n:1},
  {k:'初戦日',h:'初戦',r:s=>s['初戦日']? md(s['初戦日'])+' '+s['初戦の回戦'] : '—'},
  {k:'初戦の相手',h:'初戦の相手'}
];
function drawSchools(){
  const rows=sFiltered();
  $('#s-count').textContent = `${rows.length} / ${DATA.schools.length}校`;

  const cards=$('#s-cards'); cards.textContent='';
  if(!rows.length) cards.append(el('p','empty','該当する学校はありません'));
  rows.forEach(s=>cards.append(schoolCard(s)));

  const t=$('#s-table'); t.textContent='';
  const thead=el('thead'), tr=el('tr');
  S_COLS.forEach(c=>{
    const th=el('th', c.n?'n':'');
    th.append(c.h + (S.sort===c.k ? (S.dir>0?' ▲':' ▼') : ''));
    th.addEventListener('click',()=>{
      if(S.sort===c.k) S.dir=-S.dir; else { S.sort=c.k; S.dir=NUMCOL.includes(c.k)?-1:1; }
      const sel=$('#s-sort'); sel.value=[...sel.options].some(o=>o.value===c.k)?c.k:sel.value;
      drawSchools();
    });
    tr.append(th);
  });
  thead.append(tr); t.append(thead);
  const tb=el('tbody');
  rows.forEach(s=>{
    const r=el('tr');
    S_COLS.forEach(c=>{
      const td=el('td', c.n?'n':'');
      const v=c.r? c.r(s) : s[c.k];
      if(v instanceof Node) td.append(v); else td.append(String(v));
      r.append(td);
    });
    r.addEventListener('click',()=>openSchool(s['学校名']));
    tb.append(r);
  });
  t.append(tb);
}

/* ---------- 詳細シート ---------- */
let lastFocus=null;
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#veil').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  if(lastFocus) lastFocus.focus();
}
$('#veil').addEventListener('click',closeSheet);
$('#sheet-close').addEventListener('click',closeSheet);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#sheet').classList.contains('on')) closeSheet(); });

function openSchool(name){
  const s=DATA.schools.find(x=>x['学校名']===name);
  if(!s) return;
  lastFocus=document.activeElement;
  $('#sheet-title').textContent=s['学校名'];
  const b=$('#sheet-body'); b.textContent='';

  const fh=el('div','favhead');
  fh.append(starBtn(sid(name), ()=>{ drawSchools(); }));
  fh.append(el('span','dsub', `${s['都道府県']}（${s['地区']}）・${s['公私']}・${s['夏の出場']}`));
  b.append(fh);
  if(s['チームの特徴']) b.append(el('p','feature', s['チームの特徴']));

  b.append(el('h3','sec','このチームのメモ'));
  b.append(memoBox(sid(name), name));

  const kv=el('dl','kv');
  const add=(k,v)=>{ if(v==null||v==='') return; kv.append(el('dt',null,k), el('dd',null,v)); };
  if(s['初戦日']) add('初戦', `${md(s['初戦日'])} ${s['初戦の回戦']} ${s['初戦の試合']} ${s['初戦の開始時刻']} / vs ${s['初戦の相手']}`);
  add('夏の甲子園', `${s['夏の出場回数']}回目（${s['出場間隔']}）`);
  add('春の甲子園', s['春の出場回数']===''? '出典で確認できず' : `${s['春の出場回数']}回`);
  if(s['春の出場回数_備考']) add('春の備考', s['春の出場回数_備考']);
  add('監督', s['監督'] + (s['部長'] ? `（部長 ${s['部長']}）` : ''));
  add('所在地', s['所在地']);
  add('部員数', s['部員数'] ? `${s['部員数']}名`
                            : (s['登録人数_球歴'] ? `${s['登録人数_球歴']}名（球歴.com登録人数）` : ''));
  add('チーム打率', s['チーム打率'] ? `${s['チーム打率']}（地方大会）` : '');
  add('創立 / 創部', (s['創立']||s['創部']) ? `${s['創立']||'—'}年 / ${s['創部']||'—'}年` : '');
  add('ベンチ入り', `${s['ベンチ入り']}名（3年${s['3年']}・2年${s['2年']}・1年${s['1年']}）`);
  add('左投げ', `${s['左投げ']}名`);
  add('県外中学出身', `${s['県外中学出身']}名`);
  add('主なプロ野球OB', s['主なプロ野球OB']);
  b.append(kv);

  const hasStat=DATA.players.some(p=>p['学校名']===name && p['打数']);
  b.append(el('h3','sec','ベンチ入りメンバー（★で登録・✎でメモ）'));
  const t=el('table','roster');
  const th=el('thead'), tr=el('tr');
  // 出身中学は成績の有無にかかわらず出す。列が増えるぶんは .scrollx の横スクロールで見る。
  const cols = hasStat
    ? ['★','#','選手名','学年','投/打','守備','打順','試合','打数','安打','打点','本','三振','四死','犠打','盗塁','失策','打率','身長/体重','出身中学・チーム','✎']
    : ['★','#','選手名','学年','投/打','守備','身長/体重','出身中学・チーム','✎'];
  cols.forEach(h=>tr.append(el('th',null,h)));
  th.append(tr); t.append(th);
  const tb=el('tbody');
  DATA.players.filter(p=>p['学校名']===name)
    .sort((x,y)=>+x['背番号']-+y['背番号'])
    .forEach(p=>{
      const id=pid(p);
      const r=el('tr');
      const tdStar=el('td'); tdStar.append(starBtn(id, drawPlayers)); r.append(tdStar);
      r.append(el('td',null,p['背番号']));
      const tdName=el('td'); tdName.append(p['選手名']);
      if(p['主将']) tdName.append(' ', el('span','tag tag--both','主将'));
      r.append(tdName);
      r.append(el('td',null,p['学年']? p['学年']+'年' : '—'));
      r.append(el('td',null,p['投']+'/'+p['打']));
      r.append(el('td',null,p['守備']||p['守備位置']||'—'));
      if(hasStat){
        const n=v=>el('td','num', v===''||v==null ? '—' : v);
        r.append(n(p['打順']));
        ['試合数','打数','安打','打点','本塁打','三振','四死球','犠打','盗塁','失策','打率']
          .forEach(k=>r.append(n(p[k])));
      }
      r.append(el('td',null,p['身長cm']? `${p['身長cm']}/${p['体重kg']}` : '—'));
      r.append(el('td',null,(p['出身都道府県']? p['出身都道府県']+'・':'')+p['出身中学・チーム']));

      // メモ行は必要になるまで作らない。開いたままにできるようトグルで持つ。
      const memoRow=el('tr'); memoRow.hidden=true;
      const memoTd=el('td'); memoTd.colSpan=cols.length; memoTd.style.padding='4px 8px 12px';
      memoTd.append(memoBox(id, p['選手名']));
      memoRow.append(memoTd);

      const tdMemo=el('td');
      const mb=el('button','star', STORE.note(id)? '✎' : '✎');
      mb.type='button'; mb.style.fontSize='15px'; mb.title='メモ';
      if(STORE.note(id)) mb.setAttribute('aria-pressed','true');
      mb.addEventListener('click',()=>{
        memoRow.hidden=!memoRow.hidden;
        if(!memoRow.hidden) memoTd.querySelector('textarea').focus();
      });
      tdMemo.append(mb); r.append(tdMemo);

      tb.append(r); tb.append(memoRow);
    });
  t.append(tb);
  // 成績つきは列が多いので、表だけ横スクロールさせる（本文は横に流さない）
  const wrap=el('div','scrollx'); wrap.append(t); b.append(wrap);

  // 投手成績
  const ps=(DATA.pitchers||[]).filter(x=>x['学校名']===name);
  if(ps.length){
    b.append(el('h3','sec','投手成績（地方大会）'));
    const pt=el('table','roster');
    const pth=el('thead'), ptr=el('tr');
    ['投手','投','試合','回数','被安打','奪三振','与四死球','失点'].forEach(h=>ptr.append(el('th',null,h)));
    pth.append(ptr); pt.append(pth);
    const ptb=el('tbody');
    ps.forEach(x=>{
      const r=el('tr');
      r.append(el('td',null,x['投手']));
      r.append(el('td',null,x['投']));
      r.append(el('td','num',x['試合数']));
      // 0回2/3 とは書かず 2/3 と出す
      const inn=(x['回数']&&x['回数']!=='0'? x['回数'] : '') +
                (x['回数_端数']? (x['回数']&&x['回数']!=='0'?' ':'')+x['回数_端数'] : '');
      r.append(el('td','num', inn || '0'));
      ['被安打','奪三振','与四死球','失点'].forEach(k=>r.append(el('td','num',x[k])));
      ptb.append(r);
    });
    pt.append(ptb); b.append(pt);
  }

  // 地方大会の戦績
  const gs=(DATA.games||[]).filter(g=>g['学校名']===name);
  if(gs.length){
    b.append(el('h3','sec','地方大会の戦績'));
    const t=el('table','roster');
    const th=el('thead'), tr=el('tr');
    ['回戦','相手','スコア'].forEach(h=>tr.append(el('th',null,h)));
    th.append(tr); t.append(th);
    const tb=el('tbody');
    gs.forEach(g=>{
      const r=el('tr');
      r.append(el('td',null,g['回戦']));
      r.append(el('td',null,g['相手']));
      r.append(el('td',null,`${g['得点']}-${g['失点']}`));
      tb.append(r);
    });
    t.append(tb); b.append(t);
  }

  $('#sheet').classList.add('on'); $('#veil').classList.add('on');
  $('#sheet').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  b.scrollTop=0;
  $('#sheet-close').focus();
}

/* ---------- 選手 ---------- */
const P={q:'',kind:'',grade:'',th:'',bat:'',fav:false};
$('#p-fav').addEventListener('click',e=>{
  P.fav=!P.fav; e.target.setAttribute('aria-pressed',String(P.fav)); drawPlayers();
});
[['#p-q','input','q'],['#p-grade','change','grade'],['#p-throw','change','th'],['#p-bat','change','bat']]
  .forEach(([sel,ev,key])=> $(sel).addEventListener(ev, e=>{ P[key]=e.target.value.trim?e.target.value.trim():e.target.value; drawPlayers(); }));

function drawPlayers(){
  const pool=DATA.players;
  const rows=pool.filter(p=>{
    if(P.fav && !STORE.isFav(pid(p))) return false;
    if(P.grade && p['学年']!==P.grade) return false;
    if(P.th && p['投']!==P.th) return false;
    if(P.bat && p['打']!==P.bat) return false;
    if(P.q && !(p['選手名']+' '+p['学校名']+' '+p['出身中学・チーム']+' '+p['出身都道府県']).includes(P.q)) return false;
    return true;
  }).sort((a,b)=> String(a['学校名']).localeCompare(String(b['学校名']),'ja') || (+a['背番号']-+b['背番号']));

  $('#p-count').textContent = `${rows.length} / ${pool.length}名`;
  const host=$('#p-list'); host.textContent='';
  if(!rows.length){ host.append(el('p','empty','該当する選手はいません')); $('#p-more').textContent=''; return; }

  rows.slice(0,400).forEach(p=>{
    const r=el('div','prow'); r.setAttribute('role','button'); r.tabIndex=0;
    r.append(el('div','prow__no', p['背番号']));
    const mid=el('div');
    mid.append(el('div','prow__name', p['選手名']));
    mid.append(el('div','prow__sub', `${p['学校名']}・${p['学年']?p['学年']+'年':'学年不明'}・${p['出身都道府県']}${p['出身中学・チーム']?'／'+p['出身中学・チーム']:''}`));
    if(STORE.note(pid(p))) mid.append(el('div','hasmemo','✎ メモあり'));
    r.append(mid);
    r.append(el('div','prow__hand', p['投']+'/'+p['打']));
    r.append(starBtn(pid(p), drawPlayers));
    const go=()=>openSchool(p['学校名']);
    r.addEventListener('click',go);
    r.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    host.append(r);
  });

}

/* ---------- ランキング ---------- */
// 地方大会の成績（誌面）で並べる。打率は打数が少ないと1打数1安打が上に来てしまうので
// 下限を設ける。被安打・失点は少ないほうが良いので昇順にする。
const R={cat:'打率', min:10, pmin:10, grade:''};
const R_ASC = {'P被安打':1,'P失点':1};

function pInn(x){
  const n = parseInt(x['回数'],10) || 0;
  const f = x['回数_端数']==='1/3' ? 1/3 : x['回数_端数']==='2/3' ? 2/3 : 0;
  return n + f;
}
function pInnLabel(x){
  const n = parseInt(x['回数'],10) || 0;
  const f = x['回数_端数'] || '';
  if (n && f) return n + ' ' + f;
  return n ? String(n) : (f || '0');
}

[['#r-cat','cat'],['#r-min','min'],['#r-pmin','pmin'],['#r-grade','grade']]
  .forEach(([sel,key])=> $(sel).addEventListener('change', e=>{
    R[key] = (key==='min'||key==='pmin') ? +e.target.value : e.target.value;
    drawRank();
  }));

function drawRank(){
  const isP = R.cat.startsWith('P');
  $('#r-min').style.display   = (R.cat==='打率') ? '' : 'none';
  $('#r-pmin').style.display  = isP ? '' : 'none';
  $('#r-grade').style.display = isP ? 'none' : '';

  const cols = isP
    ? ['#','投手','学校','記録','試合','回数','被安打','奪三振','与四死球','失点']
    : ['#','選手名','学校','学年','記録','試合','打数','安打','本塁打','打点','打率'];

  let rows, val, cells, open;

  if (isP) {
    const key = R.cat.slice(1);
    rows = (DATA.pitchers||[]).filter(x=> pInn(x) >= R.pmin);
    val  = x => key==='回数' ? pInn(x) : (+x[key] || 0);
    cells = x => [x['投手'], x['学校名'], (key==='回数'? pInnLabel(x) : x[key]),
                  x['試合数'], pInnLabel(x), x['被安打'], x['奪三振'], x['与四死球'], x['失点']];
    open = x => openSchool(x['学校名']);
  } else {
    rows = DATA.players.filter(p=>{
      if (R.grade && p['学年'] !== R.grade) return false;
      if (p[R.cat] === '' || p[R.cat] == null) return false;
      if (R.cat === '打率') return (+p['打数'] || 0) >= R.min;
      return (+p[R.cat] || 0) > 0;
    });
    val  = p => R.cat==='打率' ? (parseFloat(p['打率']) || 0) : (+p[R.cat] || 0);
    cells = p => [p['選手名'], p['学校名'], (p['学年']? p['学年']+'年' : '—'), p[R.cat],
                  p['試合数'], p['打数'], p['安打'], p['本塁打'], p['打点'], p['打率'] || '—'];
    open = p => openSchool(p['学校名']);
  }

  const sign = R_ASC[R.cat] ? 1 : -1;
  rows.sort((a,b)=> sign*(val(a)-val(b)) || String(a['学校名']).localeCompare(String(b['学校名']),'ja'));

  // 50位で切るが、同記録の選手は最後まで載せる
  let cut = Math.min(50, rows.length);
  while (cut < rows.length && val(rows[cut]) === val(rows[cut-1])) cut++;
  const shown = rows.slice(0, cut);

  $('#r-count').textContent = `${rows.length}名中 ${shown.length}名`;

  const t=$('#r-table'); t.textContent='';
  const th=el('thead'), tr=el('tr');
  cols.forEach(h=>tr.append(el('th',null,h)));
  th.append(tr); t.append(th);

  const tb=el('tbody');
  if (!shown.length) {
    const r=el('tr'), td=el('td',null,'該当する記録はありません');
    td.colSpan=cols.length; r.append(td); tb.append(r);
  }
  let rank=0, prev=null;
  shown.forEach((x,i)=>{
    const v=val(x);
    if (v!==prev){ rank=i+1; prev=v; }          // 同記録は同順位
    const r=el('tr');
    r.append(el('td','num', rank));
    cells(x).forEach((c,idx)=> r.append(el('td', idx>=2?'num':null, c==='' || c==null ? '—' : c)));
    r.style.cursor='pointer';
    r.addEventListener('click',()=>open(x));
    tb.append(r);
  });
  t.append(tb);

  $('#r-note').textContent = R.cat==='打率'
    ? '地方大会の成績。打率は選んだ打数以上の選手だけを対象にしています。行をタップするとその学校が開きます。'
    : '地方大会の成績。行をタップするとその学校が開きます。';
}

/* ---------- 日程 ---------- */
const M={round:''};
function buildRounds(){
  const host=$('#m-rounds'); host.textContent='';
  const mk=(label,val)=>{
    const b=el('button','chip',label);
    b.setAttribute('aria-pressed', String(M.round===val));
    b.addEventListener('click',()=>{ M.round=val; buildRounds(); drawMatches(); });
    host.append(b);
  };
  mk('すべて','');
  [...new Set(DATA.matches.map(m=>m['回戦']))].forEach(r=>mk(r,r));
}
function sideNode(name,pref,score,tbd){
  const s=el('div','side'+(tbd?' side--tbd':''));
  const btn=el('button','side__name', tbd?'未定':name); btn.type='button';
  if(!tbd) btn.addEventListener('click',()=>openSchool(name));
  else btn.disabled=true;
  s.append(btn);
  if(!tbd && pref) s.append(el('span','side__pref', pref));
  if(score!=='' && score!=null) s.append(el('span','side__score', score));
  return s;
}
function drawMatches(){
  const rows=DATA.matches.filter(m=>!M.round||m['回戦']===M.round);
  $('#m-count').textContent = `対戦カード確定 ${rows.filter(m=>m['確定']).length} / 全${rows.length}枠`;
  const host=$('#m-list'); host.textContent='';
  const byDate={};
  rows.forEach(m=>{ (byDate[m['日付']] = byDate[m['日付']] || []).push(m); });
  Object.keys(byDate).sort().forEach(date=>{
    const list=byDate[date], wrap=el('div','day'), h=el('div','dayhead');
    h.append(el('span','d', `${+date.slice(5,7)}月${+date.slice(8,10)}日(${list[0]['曜日']})`));
    h.append(el('span','n', `大会${list[0]['大会日']}日目`));
    wrap.append(h);
    const box=el('div','games');
    list.forEach(m=>{
      const g=el('div','game'), hd=el('div','game__hd');
      hd.append(el('span','game__rd', `${m['回戦']} ${m['試合']}`));
      hd.append(el('span','game__tm', m['開始時刻']));
      g.append(hd);
      g.append(sideNode(m['対戦校1'],m['対戦校1_都道府県'],m['対戦校1_得点'],!m['対戦校1']));
      g.append(sideNode(m['対戦校2'],m['対戦校2_都道府県'],m['対戦校2_得点'],!m['対戦校2']));
      box.append(g);
    });
    wrap.append(box); host.append(wrap);
  });
}

/* ---------- ★タブ ---------- */
function playerById(id){
  const body=id.slice(2), i=body.indexOf('|');
  const sc=body.slice(0,i), nm=body.slice(i+1);
  return DATA.players.find(p=>p['学校名']===sc && p['選手名']===nm) || {'学校名':sc,'選手名':nm};
}
function favCard(id){
  const isSchool=id.startsWith('s:');
  const card=el('div','favcard');
  const head=el('div','favhead');
  head.append(starBtn(id, drawFavs));
  const title=el('div');
  if(isSchool){
    const nm=id.slice(2);
    title.append(el('h4',null,nm));
    const s=DATA.schools.find(x=>x['学校名']===nm);
    title.append(el('p','who', s? `${s['都道府県']}・${s['監督']||''}監督` : 'チーム'));
  }else{
    const p=playerById(id);
    title.append(el('h4',null,p['選手名']));
    title.append(el('p','who',
      `${p['学校名']}` + (p['背番号']?` #${p['背番号']}`:'') +
      (p['学年']?`・${p['学年']}年`:'') + (p['守備位置']?`・${p['守備位置']}`:'')));
  }
  head.append(title);
  card.append(head);
  const note=STORE.note(id);
  if(note) card.append(el('p','note', note));
  const open=el('button','btn','詳細を開く');
  open.style.marginTop='8px';
  open.addEventListener('click',()=>openSchool(isSchool? id.slice(2) : playerById(id)['学校名']));
  card.append(open);
  return card;
}
function drawFavs(){
  const m=STORE.all();
  const ids=[...new Set([...Object.keys(m.favs), ...Object.keys(m.notes)])];
  const schools=ids.filter(i=>i.startsWith('s:')).sort();
  const players=ids.filter(i=>i.startsWith('p:')).sort();
  $('#f-count').textContent = `チーム${schools.length} / 選手${players.length}`;
  const host=$('#f-list'); host.textContent='';
  if(!ids.length){
    host.append(el('p','empty','★を押すか、メモを書くとここに集まります（あなただけに見えます）'));
    return;
  }
  if(schools.length){ host.append(el('h3','sec','チーム')); schools.forEach(i=>host.append(favCard(i))); }
  if(players.length){ host.append(el('h3','sec','選手'));   players.forEach(i=>host.append(favCard(i))); }
}

/* ---------- 書き出し・読み込み ---------- */
function msg(t){ $('#io-msg').textContent=t; }
$('#io-export').addEventListener('click', async ()=>{
  const json=JSON.stringify(STORE.all(),null,2);
  const filename=`koshien2026-favorites-${new Date().toISOString().slice(0,10)}.json`;
  // Artifactではdownloads機能、ローカルHTMLでは通常のダウンロードを使う
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename, data:json}); msg('書き出しました'); }
    catch(e){ msg('書き出しは取り消されました'); }
    return;
  }
  try{
    const a=el('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download=filename; a.click(); URL.revokeObjectURL(a.href); msg('書き出しました');
  }catch(e){ msg('書き出せませんでした: '+e.message); }
});
$('#io-import').addEventListener('click',()=>{
  const inp=el('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.addEventListener('change',()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const o=JSON.parse(rd.result);
        if(typeof o!=='object'||o===null) throw new Error('形式が違います');
        STORE.replace(o); syncFavUI(); drawSchools(); drawPlayers(); drawFavs();
        msg('読み込みました（既存の内容は置き換わりました）');
      }catch(e){ msg('読み込めませんでした: '+e.message); }
    };
    rd.readAsText(f);
  });
  inp.click();
});
$('#io-clear').addEventListener('click',()=>{
  if(!confirm('お気に入りとメモをすべて消します。よろしいですか？')) return;
  STORE.clear(); syncFavUI(); drawSchools(); drawPlayers(); drawFavs(); msg('消しました');
});

    window.__bootApp(data);
  }
  async function attempt(pass, silent){
    btn.disabled = true; err.textContent = silent ? '' : '確認しています…';
    try { boot(await unlock(pass), pass); }
    catch(e){
      btn.disabled = false;
      if (silent) { err.textContent = ''; return; }
      err.textContent = (e && e.message && e.message !== 'bad')
        ? e.message : '合い言葉が違うようです';
      inp.select();
    }
  }
  btn.addEventListener('click', function(){ if (inp.value) attempt(inp.value, false); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && inp.value) attempt(inp.value, false); });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) attempt(saved, true); else inp.focus();
})();
</script>
</body>
